name: Publish proposal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: bogacho-static-release
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Collect public site
        run: |
          mkdir _public
          cp index.html style.css app.js data.js assortment-table.html _public/
          cp -R assets documents _public/
          touch _public/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _public
      - uses: actions/deploy-pages@v4
        id: deployment
